name: Publish legacy release

# The 0.5.x line is the last one that supports Python 3.9. It lives on the
# legacy/0.5.x branch; current releases publish from main with main's own
# workflow. A tag push runs the workflow file at the tagged commit, so this file
# only ever handles v0.5.* tags on that branch.

on:
  push:
    tags: ['v0.5.*']

permissions:
  contents: read
  id-token: write

env:
  POETRY_VERSION: 1.8.5
  # pipx runs Poetry under the runner's system Python; without this Poetry
  # builds the venv from its own interpreter and ignores actions/setup-python.
  POETRY_VIRTUALENVS_PREFER_ACTIVE_PYTHON: "true"

jobs:
  qualify-and-publish:
    name: Qualify and publish the legacy Python 3.9 line
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install pinned Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Verify tag, version, branch, and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin legacy/0.5.x
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/legacy/0.5.x; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on origin/legacy/0.5.x."
            exit 1
          fi
          VERSION="$(poetry version -s)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}."
            exit 1
          fi
          if [[ "${VERSION}" != 0.5.* ]]; then
            echo "::error::This workflow publishes only the 0.5.x legacy line."
            exit 1
          fi
          if ! grep -Fq "## [${VERSION}] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing PyPI version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cje-eval/${VERSION}/json")"
          if [[ "${STATUS}" == "200" ]]; then
            echo "::error::cje-eval ${VERSION} already exists on PyPI."
            exit 1
          fi
          if [[ "${STATUS}" != "404" ]]; then
            echo "::error::Could not verify PyPI version availability (HTTP ${STATUS})."
            exit 1
          fi

      - name: Install and run the fast suite on Python 3.9
        run: |
          poetry install --no-interaction
          poetry run pytest cje/tests/ -m "not slow" -q

      - name: Build artifacts once
        run: poetry build

      - name: Smoke-test the built wheel (banner and version)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${WHEEL}"
          python -m venv "${RUNNER_TEMP}/legacy-smoke"
          "${RUNNER_TEMP}/legacy-smoke/bin/python" -m pip install "${WHEEL}"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/legacy-smoke/bin/python" -c \
            "import cje; assert cje.__version__ == '${VERSION}', cje.__version__" \
            2> banner.txt
          cat banner.txt
          grep -q "legacy Python 3.9 line" banner.txt

      - name: Publish exact artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      # No GitHub release: the repository's latest release stays the current
      # (0.9+) line. The tag and CHANGELOG.md on this branch record 0.5.x.
